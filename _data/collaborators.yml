# Collaborators shown on /collaborators/ as one list, sorted alphabetically by `surname`.
# ---------------------------------------------------------------------------
# Each entry: name (add ", PhD" where it applies), surname (used for sorting), role (academic title),
# institution (university only),
# photo (square, 600 x 600 px recommended, saved in assets/img/collaborators/).
# No personal links by design. An entry without a photo shows initials.
# ---------------------------------------------------------------------------
members:
  - name: Li Jin, PhD
    surname: Jin
    role: Associate Professor
    institution: San José State University
    photo: /assets/img/collaborators/li-jin.jpg
  - name: Weizhi Lin, PhD
