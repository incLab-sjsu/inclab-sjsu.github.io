    photo: /assets/img/collaborators/jialan-si.jpg

# Map pins shown above the list: one pin per city (not per person), approximate coordinates in decimal degrees.
# `home: true` marks the lab and gets the large gold pin. `name` is only for screen readers and your reference.
pins:
  - name: San José, USA
    lat: 37.34
    lon: -121.89
    home: true
  - name: Xi'an, China
    lat: 34.34
    lon: 108.94
  - name: Hefei, China
    lat: 31.82
    lon: 117.23

