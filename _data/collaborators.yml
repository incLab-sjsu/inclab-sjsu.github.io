    photo: /assets/img/collaborators/yuliang-sun.jpg
  - name: Wenfei Zhu, PhD
    surname: Zhu
    role: Professor
    institution: Shaanxi Normal University, Xi'an, China
  - name: Lei Jiang
    surname: Jiang
    role: Associate Professor
    institution: Anhui Medical University, Hefei, China
  - name: Jialan Si
    surname: Si
    role: Lecturer
