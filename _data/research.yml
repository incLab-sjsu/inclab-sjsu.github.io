# Research themes. Shown as cards on the home page and as sections on /research/, in this order.
# Each theme: id (URL anchor), image (illustration or photo, 16:10 works best), title, summary (one sentence),
#             details (one short, general paragraph).
# Keep the text broad: directions only, no specific methods or study questions.
- id: aging-fatigue
  image: /assets/img/research/aging-fatigue.svg
  title: Aging, fatigue, and fall risk
  summary: How aging and fatigue change the way people stand and walk, and what that means for staying safe and mobile.
  details:
    - >-
      We are interested in why some people stay steady as they age or tire while others do not, and in better
      ways to recognize risk early.

- id: brain-movement
  image: /assets/img/research/brain-movement.svg
  title: Brain and behavior in movement control
  summary: How the nervous system and muscles organize posture and gait, and what movement reveals about that control.
  details:
    - >-
      We study the links between the nervous system, muscle function, and everyday movement to understand how
      control adapts, and when it begins to fail.

- id: intelligent-assessment
  image: /assets/img/research/intelligent-assessment.svg
  title: Intelligent movement assessment
  summary: AI-integrated and wearable technologies that bring neuromotor assessment beyond the laboratory.
  details:
    - >-
      With collaborators in engineering and clinical science, we are exploring data-driven approaches that could
      bring neuromotor assessment into everyday settings.

- id: neurodiversity-neurodegeneration
  image: /assets/img/research/neurodiversity-neurodegeneration.svg
  title: Neurodiversity and neurodegeneration across the lifespan
  summary: Motor function in neurodivergent populations (such as autism and Down syndrome) and in movement disorders and neurological conditions (such as Parkinson's disease and stroke).
  details:
    - >-
      A growing direction for the lab, building on Dr. Qu's postdoctoral work, toward understanding neuromotor
      control in these populations across the lifespan.
