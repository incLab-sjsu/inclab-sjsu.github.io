pi:
  name: Hang Qu, PhD
  role: Principal Investigator
  title: Assistant Professor of Motor Behavior
  department: Department of Kinesiology, San José State University
  photo: /assets/img/people/hang-qu.jpg
  email: hang.qu@sjsu.edu
  office: Spartan Complex 164
  links:
    - label: Google Scholar
      url: https://scholar.google.com/citations?user=Qzs6XVkAAAAJ
    - label: SJSU faculty page
      url: https://www.sjsu.edu/people/hang.qu/
  bio:
    - >-
      Dr. Hang Qu is an Assistant Professor of Motor Behavior in the Department of Kinesiology at San José State
      University and directs the Intelligent Neuromotor Control Lab. Dr. Qu's research asks how the nervous system
      controls movement, and how that control changes with aging, fatigue, and neurodevelopmental conditions such as
      autism.
    - >-
      Dr. Qu earned a PhD in Motor Control and Biomechanics from Iowa State University, where the doctoral work
      examined how fatigue affects gait, balance, and cortical activity in older adults. Dr. Qu then completed
      postdoctoral training in the Neurocognitive and Behavioral Development Lab at the University of Florida,
      studying motor and neurocognitive function in autistic adults in middle and older age.
    - >-
      At SJSU, Dr. Qu teaches in the motor behavior area and mentors graduate and undergraduate students in
      human-participant research on balance, gait, and the brain.
  education:
    - Postdoctoral training, Neurocognitive and Behavioral Development Lab, University of Florida
    - PhD, Motor Control and Biomechanics, Iowa State University

