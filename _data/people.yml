pi:
  name: Hang Qu, PhD
  role: Principal Investigator
  title: Assistant Professor of Motor Behavior
  department: Department of Kinesiology, San José State University
  photo: /assets/img/people/hang-qu.jpg
  email: hang.qu@sjsu.edu
  office: Spartan Complex 164
  links:
    - label: Google Scholar
      url: https://scholar.google.com/citations?user=Qzs6XVkAAAAJ
    - label: SJSU faculty page
      url: https://www.sjsu.edu/people/hang.qu/
  bio:
    - >-
      Dr. Hang Qu is an Assistant Professor of Motor Behavior in the Department of Kinesiology at San José State
      University, where she directs the Intelligent Neuromotor Control Lab. Her research asks how the nervous
      system controls movement, and how that control changes with aging, fatigue, neurodegeneration, and
      neurodiversity.
    - >-
      She earned a PhD in Motor Control and Biomechanics from Iowa State University, where her dissertation
      examined how mental and physical fatigue affect cortical activity, gait, balance control, and cognitive
      performance in older adults. She then completed postdoctoral training in the Neurocognitive and Behavioral
      Development Lab at the University of Florida, studying motor and neurocognitive function in neurodivergent
      adults (autism) across middle and older age by integrating movement analysis with neuroimaging, in projects
      funded by the
      National Institute on Aging and the National Institute of Neurological Disorders and Stroke.
    - >-
      She is now extending these lines of research toward AI-integrated and wearable health technologies for
      neuromotor assessment in neurodevelopmental and neurodegenerative populations, with the goal of detecting
      decline earlier and supporting independent movement. At SJSU she teaches KIN 165 Motor Development and
      KIN 166 Motor Learning, and is building a team of graduate and undergraduate students for human-participant
      research on balance, gait, and the brain.
  education:
    - Postdoctoral training, Neurocognitive and Behavioral Development Lab, University of Florida
    - PhD, Motor Control and Biomechanics, Iowa State University
    - MS, Biomechanics and Sports Medicine, University of Tennessee, Knoxville
    - BS, Kinesiology, Shanghai University of Sport

