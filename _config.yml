# ---------------------------------------------------------------------------
# Intelligent Neuromotor Control Lab (INCL) website
# Jekyll site built natively by GitHub Pages ("Deploy from a branch").
# Edit the values below, commit, and GitHub rebuilds the site in about a minute.
# ---------------------------------------------------------------------------
title: Intelligent Neuromotor Control Lab
short_title: INC Lab
tagline: Understanding how the nervous system controls movement across the lifespan
description: >-
  The Intelligent Neuromotor Control Lab (INC Lab), directed by Dr. Hang Qu at San José State University
  (SJSU), studies how the
  nervous system controls posture, gait, and balance, and how that control changes with aging,
  fatigue, neurodiversity, and neurodegenerative and neurological conditions. Based in Silicon Valley, the lab applies artificial
  intelligence and machine learning to movement data, with the goal of developing wearable digital health
  technologies for neuromotor assessment, in collaboration with engineers and with scholars around the world.
lang: en
timezone: America/Los_Angeles
logo: /assets/img/favicon/icon-512.png

# DEPLOYMENT ADDRESS ---------------------------------------------------------
# Custom domain (current), served by GitHub Pages behind Cloudflare: https://hangqulab.org/
#   url: "https://hangqulab.org"   baseurl: ""   plus a CNAME file containing hangqulab.org
# Organization root site without the custom domain: https://inclab-sjsu.github.io/
#   url: "https://inclab-sjsu.github.io"   baseurl: ""
# Project site under an account:           https://<account>.github.io/<repository>/
#   url: "https://<account>.github.io"     baseurl: "/<repository>"
# Custom domain (after adding a CNAME file): url: "https://your-domain"  baseurl: ""
url: "https://hangqulab.org"
baseurl: ""

author:
  name: Hang Qu

# Search engines: paste the verification token from Google Search Console (and Bing Webmaster Tools) here.
# webmaster_verifications:
#   google: PASTE_TOKEN_HERE
#   bing: PASTE_TOKEN_HERE

# Contact details used in the footer and on the Join page
contact:
  pi_name: Hang Qu, PhD
  email: hang.qu@sjsu.edu
  phone: "(408) 924-5131"
  office: Spartan Complex 164
  department: Department of Kinesiology
  institution: San José State University
  address_line1: One Washington Square
  address_line2: San José, CA 95192-0054
  maps_url: https://www.google.com/maps/search/?api=1&query=Spartan+Complex%2C+San+Jos%C3%A9+State+University
  faculty_url: https://www.sjsu.edu/people/hang.qu/
  department_url: https://www.sjsu.edu/kinesiology/

# Publications page: years from this one onward are shown open; earlier years are collapsed behind a "Show earlier" toggle.
publications_recent_since: 2025

# Primary navigation (order matters)
nav:
  - title: Research
    url: /research/
  - title: People
    url: /people/
  - title: Publications
    url: /publications/
  - title: Collaborators
    url: /collaborators/
  - title: Join Us
    url: /join/

# No Jekyll theme: layouts and CSS live in this repository. `theme: null` stops GitHub Pages
# from applying its default Primer theme, which would otherwise overwrite assets/css/style.css.
theme: null

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

defaults:
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/img/og-image.jpg

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - HANDOFF.md
  - LICENSE
  - vendor
  - node_modules
  - scripts
  - .ruby-version
