<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__art brand__art--light gild-sheen" style="--mask-url: url('{{ '/assets/img/logo/incl-horizontal-color-640.png' | relative_url }}')">
      <picture>
        <source type="image/webp"
                srcset="{{ '/assets/img/logo/incl-horizontal-color-640.webp' | relative_url }} 640w, {{ '/assets/img/logo/incl-horizontal-color-1280.webp' | relative_url }} 1280w"
                sizes="(max-width: 640px) 210px, 280px">
        <img src="{{ '/assets/img/logo/incl-horizontal-color-640.png' | relative_url }}"
             srcset="{{ '/assets/img/logo/incl-horizontal-color-640.png' | relative_url }} 640w, {{ '/assets/img/logo/incl-horizontal-color-1280.png' | relative_url }} 1280w"
             sizes="(max-width: 640px) 210px, 280px"
             width="640" height="224" alt="{{ site.title }}, home">
      </picture>
      </span>
      <span class="brand__art brand__art--dark gild-sheen" style="--mask-url: url('{{ '/assets/img/logo/incl-horizontal-white-640.png' | relative_url }}')">
      <picture>
        <source type="image/webp"
                srcset="{{ '/assets/img/logo/incl-horizontal-white-640.webp' | relative_url }} 640w, {{ '/assets/img/logo/incl-horizontal-white-1280.webp' | relative_url }} 1280w"
                sizes="(max-width: 640px) 210px, 280px">
        <img src="{{ '/assets/img/logo/incl-horizontal-white-640.png' | relative_url }}"
             srcset="{{ '/assets/img/logo/incl-horizontal-white-640.png' | relative_url }} 640w, {{ '/assets/img/logo/incl-horizontal-white-1280.png' | relative_url }} 1280w"
             sizes="(max-width: 640px) 210px, 280px"
             width="640" height="224" alt="{{ site.title }}, home">
      </picture>
      </span>
    </a>
    <div class="site-header__controls">
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle__bars" aria-hidden="true"></span>
      <span class="nav-toggle__label">Menu</span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Primary">
      <ul>
        {%- for item in site.nav %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
    <button class="theme-switch" type="button" role="switch" aria-checked="false" aria-label="Dark mode" title="Light or dark mode">
      <span class="theme-switch__track" aria-hidden="true">
        <svg class="theme-switch__icon theme-switch__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="theme-switch__icon theme-switch__icon--moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span class="theme-switch__knob"></span>
      </span>
    </button>
    </div>
  </div>
</header>
