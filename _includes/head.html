<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.classList.remove('no-js');</script>
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('incl-theme'); } catch (e) {}
      var theme = saved;
      if (theme !== 'light' && theme !== 'dark') {
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var hour = new Date().getHours();
        theme = (prefersDark || hour >= 19 || hour < 7) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  {% seo %}
  {% include structured-data.html %}
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32">
  <link rel="icon" href="{{ '/assets/img/favicon/icon-192.png' | relative_url }}" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="{{ '/assets/img/favicon/icon-180.png' | relative_url }}">
  <meta name="theme-color" content="#0055A2">
  <link rel="preload" href="{{ '/assets/fonts/nunito-sans-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/fonts.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
